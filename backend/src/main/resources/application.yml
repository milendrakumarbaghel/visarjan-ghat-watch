server:
  port: ${PORT:8080}

spring:
  application:
    name: ghat-watch
  config:
    # Local settings such as DB_PASSWORD live in backend/.env, which is never committed.
    # Copy backend/.env.example to backend/.env and fill it in.
    import: optional:file:.env[.properties]
  datasource:
    # Connection details come from backend/.env (git-ignored) or environment variables.
    # Never put a real password in this file.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ghat_watch}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  jpa:
    open-in-view: false
    hibernate:
      # schema.sql owns the tables.
      ddl-auto: none

ghat-watch:
  # Front-end origins allowed to call the API (comma separated).
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
